name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Does this repo load the product's validator?
        id: needs_product
        shell: bash
        run: |
          if grep -rq "ADMINIUM_REPO" src 2>/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Does this repo check its pages against its tables?
        id: checks_pages
        shell: bash
        run: |
          if [ -f src/manifest-pages.test.ts ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the Adminium product
        if: steps.needs_product.outputs.value == 'true'
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          path: .adminium-product

      - name: Build the product's validator and move it out of the workspace
        if: steps.needs_product.outputs.value == 'true'
        env:
          CHECKS_PAGES: ${{ steps.checks_pages.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.adminium-product"
          corepack enable

          if [ "$CHECKS_PAGES" = "true" ]; then
            pnpm install --frozen-lockfile --filter "@adminium/manifest..." --filter "@adminium/engine..."
            pnpm --filter "@adminium/manifest..." --filter "@adminium/engine..." build
          else
            pnpm install --frozen-lockfile --filter "@adminium/manifest..."
            pnpm --filter "@adminium/manifest..." build
          fi

          mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"

      - name: Test
        env:
          ADMINIUM_REPO: ${{ steps.needs_product.outputs.value == 'true' && format('{0}/adminium-product', runner.temp) || '' }}
          ADMINIUM_REQUIRE_VALIDATOR: ${{ steps.needs_product.outputs.value }}
        run: npm test

      - name: Manifest checks
        shell: bash
        run: |
          if [ -f manifest.test.mjs ]; then
            node --test manifest.test.mjs
          else
            echo "no manifest.test.mjs in this repo — skipping"
          fi
